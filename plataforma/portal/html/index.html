<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPSIL · Aplicaciones</title>
<style>
  :root { --amarillo: #f7c600; --negro: #1a1a1a; --naranja: #f5821f; --fondo: #f6f6f4; --borde: #e3e3df; --texto: #1a1a1a; --suave: #6b6b66; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--fondo); color: var(--texto);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
         display: flex; flex-direction: column; }
  header { background: var(--negro); border-bottom: 4px solid var(--amarillo); padding: 18px 16px; display: flex; justify-content: center; }
  header img { height: 44px; }
  main { flex: 1; width: 100%; max-width: 860px; margin: 0 auto; padding: 40px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--suave); margin: 0 0 28px; font-size: 14px; }
  .apps { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
  a.app { display: block; background: #fff; border: 1px solid var(--borde); border-radius: 12px; padding: 24px;
          text-decoration: none; color: inherit; border-top: 4px solid var(--naranja); transition: transform .12s, box-shadow .12s; }
  a.app:hover, a.app:focus-visible { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.08); outline: none; }
  .icono { width: 44px; height: 44px; border-radius: 10px; background: var(--amarillo); display: grid; place-items: center; margin-bottom: 14px; }
  .icono svg { width: 24px; height: 24px; stroke: var(--negro); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .nombre { font-size: 18px; font-weight: 700; margin: 0 0 2px; }
  .otros { font-size: 13px; color: var(--suave); margin: 0 0 10px; }
  .desc { font-size: 14px; color: var(--suave); margin: 0; line-height: 1.45; }
  header { position: relative; }
  .sesion { display: flex; align-items: center; gap: 12px; position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: #fff; font-size: 13px; }
  .sesion button { background: var(--amarillo); color: var(--negro); border: 0; border-radius: 4px; padding: 6px 12px; font-weight: 600; font-size: 13px; cursor: pointer; font-family: inherit; }
  @media (max-width: 560px) { .sesion span { display: none; } }
  body.cargando main, body.cargando .sesion { visibility: hidden; }
  .aviso { text-align: center; color: var(--suave); padding: 40px 16px; }
  footer { text-align: center; font-size: 12px; color: var(--suave); padding: 18px 16px; }
</style>
</head>
<body class="cargando">
<header>
  <img src="/spsil-logo.webp" alt="SPSIL">
  <div class="sesion"><span id="usuario"></span><button type="button" id="salir">Cerrar sesión</button></div>
</header>
<main>
  <h1>Elige una aplicación</h1>
  <p class="sub">选择应用 · Choose an app — un solo inicio de sesión para todas.</p>
  <div class="apps">
    <a class="app" href="/tareas/">
      <div class="icono"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/></svg></div>
      <p class="nombre">Gestor de Tareas</p>
      <p class="otros">任务管理 · Tasks</p>
      <p class="desc">Tableros, agenda, wiki, notas y avisos del equipo.</p>
    </a>
    <a class="app" href="/stock/" data-grupos="Stock,Stock Tabla,Stock Config">
      <div class="icono"><svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg></div>
      <p class="nombre">Stock</p>
      <p class="otros">库存 · Stock</p>
      <p class="desc">Stock del almacén en tiempo real y Stock Tabla de compras.</p>
    </a>
  </div>
</main>
<footer>SPSIL</footer>
<script type="module">
  // Lo primero es el login (cliente público "portal" del realm spsil). Es la
  // misma sesión de Keycloak que usan las apps: entrar aquí vale para todas.
  // Cada tarjeta con data-grupos solo sale si la persona está en alguno de
  // esos grupos (o en IT); la app comprueba de nuevo sus permisos.
  import Keycloak from "/js/keycloak.js";
  const kc = new Keycloak({ url: "/auth", realm: "spsil", clientId: "portal" });
  try {
    await kc.init({ onLoad: "login-required", pkceMethod: "S256", checkLoginIframe: false, redirectUri: location.origin + "/" });
    const t = kc.tokenParsed || {};
    const grupos = t.groups || [];
    document.querySelectorAll("[data-grupos]").forEach((tarjeta) => {
      const permitidos = tarjeta.dataset.grupos.split(",");
      if (!grupos.includes("IT") && !permitidos.some((g) => grupos.includes(g))) tarjeta.remove();
    });
    document.getElementById("usuario").textContent = t.name || t.preferred_username || "";
    document.getElementById("salir").onclick = () => kc.logout({ redirectUri: location.origin + "/" });
  } catch (e) {
    document.querySelector("main").innerHTML =
      '<p class="aviso">No se pudo comprobar el inicio de sesión. Recarga la página en unos segundos.</p>';
    document.querySelector(".sesion").style.display = "none";
  }
  document.body.classList.remove("cargando");
</script>
</body>
</html>
