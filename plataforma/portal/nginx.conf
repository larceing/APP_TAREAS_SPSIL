# Portada + reparto por rutas. Nginx Proxy Manager ya pone el HTTPS delante y
# manda aqui todo spsil.luiscontacto03.com.
# Los destinos van en variables (con el DNS de Docker) para que el portal
# arranque aunque alguna app este parada: esa ruta da 502 y el resto sigue.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 50m;
    charset utf-8;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;

    # Portada
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }
    location = /spsil-logo.webp { root /usr/share/nginx/html; }
    # keycloak-js 26.0.7 (copiado del paquete npm, sin CDN): login de la portada
    location /js/ { root /usr/share/nginx/html; }
    # Marca SPSIL para las apps de PRO (tema y logo): APP_TEMA_CSS=https://<dominio>/marca/tareas.css
    location /marca/ { root /usr/share/nginx/html; add_header Cache-Control "public, max-age=300"; }

    # Gestor de Tareas: la app ya sabe vivir en /tareas (APP_RUTA_BASE)
    location /tareas {
        set $tareas spsil-tareas:8000;
        proxy_pass http://$tareas;
    }

    # El Stock antiguo ya no existe: lo sustituye Páginas. Los enlaces viejos van allí.
    location /stock { return 301 /paginas/; }

    # Lin-AI: se le quita el prefijo; la página usa rutas relativas (api/...).
    # Incluye el WebSocket del agente de la oficina: wss://<dominio>/linai/agente/ws
    location /linai/ {
        set $linai spsil-linai:8010;
        rewrite ^/linai/(.*)$ /$1 break;
        proxy_set_header X-Linai-App linai;
        proxy_pass http://$linai;
        proxy_read_timeout 900s;
        proxy_buffering off;
    }
    location = /linai { return 301 /linai/; }

    # Páginas (tablas tipo Power BI, sustituye a Stock): el mismo contenedor de Lin-AI,
    # que con X-Linai-App: paginas enseña solo las páginas.
    location /paginas/ {
        set $paginas spsil-linai:8010;
        rewrite ^/paginas/(.*)$ /$1 break;
        proxy_set_header X-Linai-App paginas;
        proxy_pass http://$paginas;
        proxy_read_timeout 900s;
        proxy_buffering off;
    }
    location = /paginas { return 301 /paginas/; }

    # Keycloak tiene su propia direccion, comun a todas las apps
    location /auth { return 301 https://users.luiscontacto03.com$request_uri; }

    location / { return 302 /; }
}
