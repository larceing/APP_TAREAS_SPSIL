# Despliegue de la demo de SPSIL en el servidor compartido (/opt/apps/spsil-tareas).
# Se usa JUNTO al docker-compose.yml base; con COMPOSE_FILE en .env basta
# con "docker compose up -d --build".
#
# Que cambia respecto a la base:
# - la app no publica ningun puerto en el servidor;
# - se une a la red Docker externa "proxy_default", donde vive el proxy compartido
#   (/opt/apps/proxy), con el nombre "spsil-tareas". El proxy reenvia el
#   subdominio a http://spsil-tareas:8000 y pone el HTTPS.
# - MariaDB queda solo en la red interna de este proyecto.
# Ver despliegue/DESPLIEGUE_SPSIL.md.

services:
  app:
    ports: !reset []
    networks:
      default:
      proxy_default:
        aliases:
          - spsil-tareas

networks:
  proxy_default:
    external: true
