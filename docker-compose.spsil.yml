# Despliegue de la demo de SPSIL. Se usa JUNTO al docker-compose.yml base:
#
#   docker compose -f docker-compose.yml -f docker-compose.spsil.yml up -d --build
#
# Que cambia respecto a la base:
# - la app solo escucha en 127.0.0.1 (no queda expuesta sin HTTPS);
# - con COMPOSE_PROFILES=bd-docker,https se levanta Caddy delante, que saca
#   y renueva solo el certificado de DOMINIO (Let's Encrypt). Si el servidor
#   ya tiene nginx/IIS/Traefik, quita "https" del perfil y apunta ese proxy a
#   127.0.0.1:${APP_PUERTO}.
# Ver despliegue/DESPLIEGUE_SPSIL.md.

services:
  app:
    ports: !override
      - "127.0.0.1:${APP_PUERTO:-8000}:8000"

  caddy:
    image: caddy:2.8
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:?pon DOMINIO en .env (p. ej. tareas.spsil.com)}
      CORREO_TLS: ${CORREO_TLS:-}
    volumes:
      - ./despliegue/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
      - caddy_config:/config

volumes:
  caddy_datos:
  caddy_config:
